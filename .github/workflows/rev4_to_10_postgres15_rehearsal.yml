name: PostgreSQL 15 Disposable Rehearsal (REV4 to Migration 10)

# Keamanan & Reproducibility Ketat:
# 1. Pemicu HANYA manual (workflow_dispatch). Tidak ada pemicu push maupun pull_request.
# 2. Hak akses GITHUB_TOKEN dibatasi minimum mutlak: contents: read.
# 3. Third-party actions dipin ke commit SHA penuh yang dapat diaudit.
# 4. Engine PostgreSQL 15 menggunakan versi spesifik yang dapat direproduksi (15.8-alpine).
# 5. Dependency Python dipin versinya (psycopg2-binary==2.9.10, cryptography==43.0.3, pytest==8.3.3).
# 6. Tidak ada secret remote Supabase Staging maupun kredensial produksi.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      rehearsal_tag:
        description: 'Tag atau catatan pengujian gladi bersih'
        required: false
        default: 'REV4_TO_10_REHEARSAL_MANUAL'

jobs:
  postgres15-disposable-rehearsal:
    name: Isolated Disposable PostgreSQL 15 Rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15.8-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_rehearsal_pwd
          POSTGRES_DB: clients_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.11'

      - name: 3. Install Rehearsal Dependencies (Pinned Versions)
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary==2.9.10 cryptography==43.0.3 pytest==8.3.3

      - name: 4. Execute Disposable Rehearsal Runner (REV4 -> Migration 10)
        env:
          CI: "true"
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres_rehearsal_pwd
          PGDATABASE: clients_rehearsal
        run: |
          python database_migrations/cloud/run_rev4_to_10_rehearsal.py

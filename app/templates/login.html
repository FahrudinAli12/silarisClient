<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Client Checking & Laundry Linen RS</title>
  <link rel="stylesheet" href="/static/styles.css?v=35" />
  <style>
    body, html {
      height: 100%;
      margin: 0;
      background-color: #020b14;
      color: #e6f0fa;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
    }
    .login-card {
      background: #0B2038;
      border: 1px solid #173554;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .login-header {
      text-align: center;
    }
    .brand-icon-large {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #16b9df, #0ea5e9);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(22, 185, 223, 0.3);
    }
    .brand-icon-large svg {
      width: 32px;
      height: 32px;
      fill: #020b14;
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 6px 0;
      letter-spacing: -0.01em;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #8297b0;
      margin: 0;
      line-height: 1.4;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #a0aec0;
    }
    .form-input {
      background: #061324;
      border: 1px solid #173554;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
      width: 100%;
    }
    .form-input:focus {
      border-color: #16b9df;
      box-shadow: 0 0 0 3px rgba(22, 185, 223, 0.15);
    }
    .btn-login {
      background: linear-gradient(135deg, #16b9df, #0284c7);
      border: none;
      border-radius: 8px;
      color: #020b14;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
    }
    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-icon-large">
          <svg viewBox="0 0 24 24">
            <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z" />
          </svg>
        </div>
        <h1 class="login-title">Client Checking</h1>
        <p class="login-subtitle">Masuk dengan akun resmi rumah sakit yang terdaftar</p>
      </div>

      <div id="login-alert" class="alert-error"></div>

      <form id="login-form" onsubmit="submitLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Akun</label>
          <input
            type="email"
            id="login-email"
            class="form-input"
            placeholder="operator@rs-sehat.id"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group" style="margin-top: 12px;">
          <label class="form-label" for="login-password">Kata Sandi</label>
          <input
            type="password"
            id="login-password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" id="btn-submit-login" class="btn-login" style="margin-top: 18px;">
          <span id="btn-text">Masuk ke Sistem</span>
        </button>
      </form>

      <div class="footer-note">
        Satu instalasi khusus untuk satu rumah sakit.<br/>Sesi login berlaku selama 8 jam.
      </div>
    </div>
  </div>

  <script>
    async function submitLogin(e) {
      e.preventDefault();
      const emailInput = document.getElementById("login-email");
      const passwordInput = document.getElementById("login-password");
      const alertBox = document.getElementById("login-alert");
      const btn = document.getElementById("btn-submit-login");
      const btnText = document.getElementById("btn-text");

      alertBox.style.display = "none";
      alertBox.textContent = "";
      btn.disabled = true;
      btnText.textContent = "Memverifikasi...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-ClientS-Request": "1",
          },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: passwordInput.value,
          }),
        });

        if (res.ok) {
          window.location.href = "/dashboard";
          return;
        }

        const data = await res.json().catch(() => ({}));
        let errMsg = data.detail || "Gagal masuk. Periksa email dan kata sandi Anda.";
        if (typeof errMsg !== "string") {
          errMsg = "Format permintaan tidak valid.";
        }
        alertBox.textContent = errMsg;
        alertBox.style.display = "block";
      } catch (err) {
        alertBox.textContent = "Koneksi ke server backend terputus. Silakan coba beberapa saat lagi.";
        alertBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btnText.textContent = "Masuk ke Sistem";
      }
    }
  </script>
</body>
</html>
